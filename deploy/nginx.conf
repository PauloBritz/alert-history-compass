server {
  listen 80;
  client_max_body_size 2m;
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_read_timeout 150s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
  }
}
